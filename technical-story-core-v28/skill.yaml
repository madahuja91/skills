skill:
  id: technical-story-core
  name: Technical Story Core
  version: 2.0.0
  purpose: Shared LLD contract for all technical Story area skills. Stories must be completely technical, implementation-oriented, and must not redefine Feature business scope.
  responsibility:
    owns: []
    does_not_own: []
  inputs:
    required:
    - feature
    - fac
    - aac
    - architecture_blueprint
    - migration_strategy
    - current_state_evidence
    optional:
    - sibling_stories
    - target_contracts
  source_usage:
    current_state_evidence:
      purpose: Preserve functional intent and understand legacy behavior.
    architecture_blueprint:
      purpose: Define target architecture, boundaries, contracts and design decisions.
    migration_strategy:
      purpose: Define coexistence, sequencing, compatibility, cutover and migration constraints.
    fac:
      purpose: Preserve business acceptance outcomes.
    aac:
      purpose: Enforce Feature-level architecture/design acceptance.
  analysis:
    areas: []
    rules:
    - Story must be completely technical.
    - Story must be LLD-level and implementation-oriented.
    - Story must translate Feature/FAC/AAC into an implementable technical slice.
    - Story must not redefine the Feature's business scope.
    - Story must not invent architecture decisions unsupported by architecture_blueprint.
    - Migration implications must be included when applicable.
  lld:
    mandatory:
    - technical_objective
    - technical_scope
    - target_components
    - component_responsibilities
    - interfaces_and_contracts
    - data_flow
    - dependencies
    - implementation_changes
    - configuration_changes
    - validation_and_error_handling
    - security
    - observability
    - transaction_and_consistency
    - migration_considerations
    - backward_compatibility
    - testing_strategy
    conditional:
    - persistence_model
    - messaging_contract
    - state_management
    - deployment_configuration
  output:
    schema: technical-story
    required_fields:
    - id
    - area
    - title
    - technical_objective
    - technical_scope
    - target_components
    - component_responsibilities
    - interfaces_and_contracts
    - data_flow
    - dependencies
    - implementation_changes
    - validation_and_error_handling
    - migration_considerations
    - testing_strategy
    - sac
    - traceability
  traceability:
    must_reference:
    - feature_id
    - fac_ids
    - aac_ids
    - architecture_blueprint_references
    - migration_strategy_references
    - current_state_evidence_references
    id_generation: traceability-agent
  quality:
    completeness:
    - Every applicable LLD area is addressed or explicitly marked not_applicable with rationale.
    - Story can be understood and implemented without returning to the Feature for technical details.
    consistency:
    - Technical design is consistent with architecture_blueprint.
    - Dependencies do not contradict sibling Stories.
    validation:
    - SAC is technically verifiable.
    - No unresolved architectural assumptions remain.
  constraints:
    must:
    - use exact approved Story area name.
    - separate current-state evidence from target-state design.
    - identify impacted components and interfaces.
    - make migration impact explicit where applicable.
    must_not:
    - use Frontend instead of UI.
    - use Backend instead of BFF/API.
    - create additional Story area names.
    - turn Story into a task checklist.
    - generate a Story when the area is not in shared memory selected_areas.
  skip_rule:
  - Read src/_internal/swarm/shared_memory.json selected_areas first.
  - If this agent's area is not selected, return status=skipped and write no Story.
  specialist_output_contract:
    path: src/artifacts/specialists/<area>/<id>.json
    required_fields:
    - artifactType
    - id
    - parentId
    - area
    - status
    - sourceReferences
    - content
    - acceptanceCriteria
    - confidence
    - validation
    - outputPath

  dual_write:
    json_root: src/artifacts/canonical/backlog/
    markdown_root: src/artifacts/projections/backlog/
    when: markdown_renderer_only
    governance_pass_required: false
  schema_completeness_gate:
    rule: STRICT schema compliance — All output.required_fields must be present and non-empty before status=complete; never rename/drop/stub required fields
  # dual-write rule: JSON agents write schema-complete JSON under src/artifacts/canonical/backlog/ only. Markdown Renderer (Claude Sonnet 4.5) writes matching .md twins under src/artifacts/projections/backlog/. Do not dual-write Markdown from JSON agents.
  # dual-write rule: JSON path root: src/artifacts/canonical/backlog/. Markdown path root: src/artifacts/projections/backlog/.
  # dual-write rule: All skill schema required_fields must be present and non-empty before status=complete; otherwise status=incomplete and retry.
  # dual-write rule: Never write under src/canonical/ or use flat Feature/FAC/AAC siblings of Epic.

  feature_selection:
    input: feature_selection
    epic_names_unchanged: true
    when_empty: LLM decides how many Features each Epic needs from evidence.
    when_provided: >
      Tokens epic-N-feature-M (comma/newline separated). N is 1-based Epic order
      matching epic_names / created Epics. M is exact Feature count for that Epic.
      Example: epic-1-feature-1, epic-2-feature-2 → Epic 1 gets 1 Feature, Epic 2 gets 2.
      Epics omitted from the list → LLM decides for those Epics.
  story_layer_selection:
    input: story_layer_selection
    when_empty: LLM/Story Decomposer decides selected_areas per Feature (not forced to six).
    when_provided: >
      Tokens epic-N-feature-M-story-<layer>[, <layer>...]. Layers: UI, BFF/API, Domain,
      Persistence, Messaging, Testing (aliases ui, bff, bff/api, api, domain, persistence,
      messaging, testing). Example: epic-1-feature-1-story-ui, bff/api → only UI and BFF/API
      Stories for Epic 1 Feature 1. Separate Feature scopes with semicolon or newline.
  human_readable_refs:
    rule: Never refer to Epic/Feature/FAC/AAC/Story/SAC by ID number alone. Always write the human title/name together with the id (e.g. "Order Capture (FEAT-001)", never just "FEAT-001").
  markdown_no_json_dump:
    rule: Markdown must be human-readable prose/headings/lists/tables. Never paste a full JSON object or JSON code fence of the source artifact into .md — that JSON already exists under canonical.
