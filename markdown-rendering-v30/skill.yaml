skill:
  id: markdown-rendering
  name: Markdown Rendering
  version: 2.0.0
  purpose: Sole Markdown writer (Claude Sonnet 4.5). Render schema-complete human-readable Markdown from backlog JSON. Do not author JSON.
  rules:
  - JSON is authoritative.
  - Preserve Epic -> Feature -> Story hierarchy.
  - Display FAC/AAC at Feature level.
  - Display full technical LLD sections at Story level.
  - Display SAC at Story level.
  - Preserve exact Story area names.
  - Do not add content not present in JSON.
  - Markdown Renderer owns all Markdown twins and must strictly mirror skill schema fields from JSON; do not wait only for Governance PASS once JSON exists.
  - You ALWAYS write .md twins. The JSON-agent rule "do not write Markdown" does not apply to you.
  - Forbidden status: json_only_no_markdown_writes. That decision is a failure.
  - Do not skip because validation.json is missing or not PASS. Jira waits for PASS; Markdown does not.
  - Write artifacts/projections/backlog/ folder tree mirroring canonical.

  dual_write:
    json_root: src/artifacts/canonical/backlog/
    markdown_root: src/artifacts/projections/backlog/
    when: markdown_renderer_only
    governance_pass_required: false
  schema_completeness_gate:
    rule: STRICT schema compliance — All output.required_fields must be present and non-empty before status=complete; never rename/drop/stub required fields
  # dual-write rule: JSON agents write schema-complete JSON under src/artifacts/canonical/backlog/ only. Markdown Renderer (Claude Sonnet 4.5) writes matching .md twins under src/artifacts/projections/backlog/. Do not dual-write Markdown from JSON agents.
  # dual-write rule: JSON path root: src/artifacts/canonical/backlog/. Markdown path root: src/artifacts/projections/backlog/.
  # dual-write rule: All skill schema required_fields must be present and non-empty before status=complete; otherwise status=incomplete and retry.
  # dual-write rule: Never write under src/canonical/ or use flat Feature/FAC/AAC siblings of Epic.

  # content rule: Never write BR/ADR/migration references; inline full details in every artifact.

  feature_selection:
    input: feature_selection
    epic_names_unchanged: true
    when_empty: LLM decides how many Features each Epic needs from evidence.
    when_provided: >
      Tokens epic-N-feature-M (comma/newline separated). N is 1-based Epic order
      matching epic_names / created Epics. M is exact Feature count for that Epic.
      Example: epic-1-feature-1, epic-2-feature-2 → Epic 1 gets 1 Feature, Epic 2 gets 2.
      Epics omitted from the list → LLM decides for those Epics.
  story_layer_selection:
    input: story_layer_selection
    when_empty: LLM/Story Decomposer decides selected_areas per Feature (not forced to six).
    when_provided: >
      Tokens epic-N-feature-M-story-<layer>[, <layer>...]. Layers: UI, BFF/API, Domain,
      Persistence, Messaging, Testing (aliases ui, bff, bff/api, api, domain, persistence,
      messaging, testing). Example: epic-1-feature-1-story-ui, bff/api → only UI and BFF/API
      Stories for Epic 1 Feature 1. Separate Feature scopes with semicolon or newline.
  human_readable_refs:
    rule: Never refer to Epic/Feature/FAC/AAC/Story/SAC by ID number alone. Always write the human title/name together with the id (e.g. "Order Capture (FEAT-001)", never just "FEAT-001").
  markdown_no_json_dump:
    rule: Markdown must be human-readable prose/headings/lists/tables. Never paste a full JSON object or JSON code fence of the source artifact into .md — that JSON already exists under canonical.

  markdown_style:
    - Render schema fields as readable sections, not as a JSON blob.
    - Forbidden: a "## JSON" / "Full JSON" section or fenced json of the entire artifact.
    - When mentioning a Feature/FAC/AAC/SAC/Story/Epic, use title + id.
