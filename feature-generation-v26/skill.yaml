skill:
  id: feature-generation
  name: Feature Generation
  version: 2.0.0
  purpose: Generate functional Features under an Epic, preserving the functional current-state boundary while aligning it with the target transformation.
  responsibility:
    owns:
    - functional capability decomposition
    - Feature boundaries
    - functional scope
    - functional rules and scenarios
    does_not_own:
    - LLD
    - technical Story decomposition
    - SAC
  inputs:
    required:
    - epic
    - codebase
    - csa_output
    - architecture_blueprint
    - migration_strategy
  source_usage:
    codebase:
      purpose: Evidence of actual functional behavior.
    csa_output:
      purpose: Primary functional current-state source.
    architecture_blueprint:
      purpose: Target functional boundary and capability alignment.
    migration_strategy:
      purpose: Identify transformation constraints affecting the Feature.
  analysis:
    mandatory_areas:
    - functional capability
    - actors
    - business workflow
    - functional behavior
    - business rules
    - functional validations
    - inputs and outputs at functional level
    - dependencies at functional level
    - current-state evidence
    - target-state intent
    - migration impact
    rules:
    - Feature must represent one coherent functional capability.
    - Feature must be independently understandable.
    - Feature must be small enough to decompose into technical Stories.
    - Preserve current-state functional meaning even when target implementation changes.
    - Architecture and migration information may influence the Feature boundary but must not turn it into an LLD artifact.
  output:
    schema: feature
    required_fields:
    - id
    - epic_id
    - title
    - description
    - functional_objective
    - functional_scope
    - actors
    - functional_flow
    - business_rules
    - functional_validations
    - dependencies
    - current_state
    - target_state_intent
    - migration_considerations
    - traceability
  naming:
    pattern: <Functional Capability>
    examples:
    - Category Data Upload and Validation
    - Customer Registration and Profile Management
    - Order Submission and Status Management
  constraints:
    must:
    - remain functional
    - be implementation-neutral
    - trace to current-state evidence
    - explain target transformation intent where supported
    must_not:
    - become a UI Feature
    - become a BFF/API Feature
    - become a Domain Feature
    - contain classes or method names
    - contain database tables
    - contain implementation tasks
    - contain LLD design

  dual_write:
    json_root: src/artifacts/canonical/backlog/
    markdown_root: src/artifacts/projections/backlog/
    when: markdown_renderer_only
    governance_pass_required: false
  schema_completeness_gate:
    rule: STRICT schema compliance — All output.required_fields must be present and non-empty before status=complete; never rename/drop/stub required fields
  # dual-write rule: JSON agents write schema-complete JSON under src/artifacts/canonical/backlog/ only. Markdown Renderer (Claude Sonnet 4.5) writes matching .md twins under src/artifacts/projections/backlog/. Do not dual-write Markdown from JSON agents.
  # dual-write rule: JSON path root: src/artifacts/canonical/backlog/. Markdown path root: src/artifacts/projections/backlog/.
  # dual-write rule: All skill schema required_fields must be present and non-empty before status=complete; otherwise status=incomplete and retry.
  # dual-write rule: Never write under src/canonical/ or use flat Feature/FAC/AAC siblings of Epic.
